org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
# The workspace contains Chinese characters. No NDK is used in this project.
android.overridePathCheck=true
kotlin.code.style=official
# Kotlin's incremental file facades are unreliable when the Windows checkout
# is edited through its Unicode path and compiled through its ASCII junction.
kotlin.incremental=false
